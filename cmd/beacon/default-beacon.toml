# Beacon Proxy configuration. Do not change config-version.
config-version = "1.0"

# "relay" (players can use /server) or "relayless" (straight to your one server).
mode = {{q .Mode}}

# Address players join by IP. Empty: Friends tab only.
bind = {{q .Bind}}

# Your domain, for a free automatic HTTPS certificate. Or set tls-cert and tls-key instead.
domain = ""
tls-cert = ""
tls-key = ""

# Secret Beacon signs logins to your servers with. Keep it private.
forwarding-secret-file = "forwarding.secret"

# World name on the Friends tab and server list.
motd = {{q .MOTD}}

# Most Bedrock players allowed on at once; more are told the server is full. Admins always
# get in. 0 means no cap.
max-players = 0

# Max players shown on the server list and on broadcast Friends-tab worlds. Only the number
# shown: it doesn't stop anyone joining (that's max-players).
show-max-players = {{.ShowMaxPlayers}}

# What the server list copies from your first server: "off", "motd", "players" or "all".
ping-passthrough = "off"

[servers]
# Your servers, as name = "host:port", or a table with options:
# survival = { address = "127.0.0.1:19134", forwarding = "endstone", resource-packs = "on-join", hold = "90s" }
#   forwarding      how it learns the player's XUID: left out (Beacon signs it) | "endstone" (Endstone 0.12+)
#   resource-packs  true: downloaded on joining the network | false: never sent | "on-join": downloaded on joining that server
#   hold            "90s"
#   transport       "nethernet" | "raknet" | "tcp"
#   allowed         ["xuid", ...]
#   hold-message    "Restarting, hold on..."   hold-reasons ["maintenance"]
#   encryption      false (tcp only)            compression false (tcp only)
#   protocols       [2193]   native [2225]   client-side-generation true
{{- range .Servers}}
{{- if or .Transport .Forwarding .NoPacks .PacksOnJoin}}
{{.Name}} = { address = {{q .Address}}{{if .Transport}}, transport = {{q .Transport}}{{end}}{{if .Forwarding}}, forwarding = {{q .Forwarding}}{{end}}{{if .NoPacks}}, resource-packs = false{{else if .PacksOnJoin}}, resource-packs = "on-join"{{end}} }
{{- else}}
{{.Name}} = {{q .Address}}
{{- end}}
{{- end}}

# Where players join, in order.
try = {{list .Try}}

[forced-hosts]
# Joins by these addresses go to these servers instead of try.
# "pvp.example.com" = ["pvp"]

[broadcast]
# World title and host name on the Friends tab. Empty: the motd.
world-name = ""
host-name = {{q .HostName}}

# XUIDs of the players who may use Beacon's admin commands. Beacon writes each one's gamertag
# after it and keeps it up to date.
admins = {{list .Admins}}

# XUIDs of moderators: /kick, /unmute, /mutelist, /banlist, and /ban and /mute for up to 1 day,
# unbanning only their own bans.
moderators = []

# Accept friend requests automatically.
accept-friends = {{.AcceptFriends}}

# Player count the Friends-tab world shows: "world" (players who joined through this world),
# "server" (players on its server) or "network" (everyone on all your servers).
player-count = {{q (or .PlayerCount "world")}}

# Server this world's players join first. Empty: try.
server = {{q .Server}}

# protected = ["Bot*"]            # names staff can't ban, mute or kick
# allowed-xuids = ["xuid"]        # only these players may join the network
# update-interval-seconds = 30    # how often the Friends-tab world is refreshed
# Another world on another Xbox account: beacon accounts add <name>
{{- range .Extra}}

# Another world, hosted by another account. Add one with: beacon accounts add <name>
[[broadcast.extra]]
name = {{q .Name}}
token-file = {{q .TokenFile}}
{{- if .HostName}}
host-name = {{q .HostName}}
{{- end}}
{{- if .WorldName}}
world-name = {{q .WorldName}}
{{- end}}
{{- if .Invites}}
invites = true
{{- end}}
{{- if .NoFriendAccept}}
accept-friends = false
{{- end}}
{{- if .Protocol}}
protocol = {{.Protocol}}
version = {{q .Version}}
{{- end}}
server = {{q .Server}}
player-count = {{q .PlayerCount}}
{{- end}}

[advanced]
# Local HTTP API on 127.0.0.1.
control-port = {{.ControlPort}}

# Let your servers share chat through the control API.
cross-server-chat = {{.CrossServerChat}}

# Beacon's /ban, /mute, /kick and related commands.
# moderation = true
# What /kick does: "network" disconnects, "server" sends the player to another of your servers.
# kick = "network"

# Flood limits. 0: no limit.
login-ratelimit = 0
packets-per-second = 0
# packets-per-second is an average over this many seconds (short bursts pass), and a single second
# over packet-burst times it is too many anyway (-1: no burst check).
packet-window = 7
packet-burst = 4
sessions-per-ip = 0

# Show this player count on the Friends tab instead of the real one. 0: off.
fake-player-count = {{.FakePlayerCount}}

# Or a Friends-tab count that wanders between min and max, moving by at most max-step at each
# update (every 30 s). Example: { min = 16, max = 26, max-step = 2 }. max = 0: off.
fake-player-drift = {{with .FakePlayerDrift}}{ min = {{.Min}}, max = {{.Max}}, max-step = {{.MaxStep}} }{{else}}{ min = 0, max = 0, max-step = 1 }{{end}}

# Where players are sent to rejoin, for "on-join" packs. Empty: they're asked to rejoin.
{{if .RejoinAddress}}rejoin-address = {{q .RejoinAddress}}{{else}}# rejoin-address = "play.example.com:19132"{{end}}

# Rarely needed (docs/config.md):
# compression = "snappy"           # with players: "snappy" | "flate" | "none"
# compression-threshold = 256      # bytes; smaller packets aren't compressed
# protocol = 0                     # with version = "1.26.60": advertise another game version
# acme-http-address = ":80"        # where Let's Encrypt checks your domain
{{if .NetworkDir}}network-dir = {{q .NetworkDir}}{{else}}# network-dir = "network"         # cache of your servers' content and packs{{end}}
{{if .DisableClientEncryption}}disable-client-encryption = true{{else}}# disable-client-encryption = false   # only if a client version can't log in{{end}}
# world-join-nonce = true          # Friends-tab and invite joins must have joined the world's session, as in Minecraft
# library-logins = "refuse"        # "refuse" | "log" | "off": logins with a client library's default data (bots)
