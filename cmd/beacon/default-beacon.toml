# Beacon Proxy configuration. Do not change config-version.
config-version = "1.0"

# "relay": players go through Beacon and can switch servers with /server.
# "relayless": players connect straight to your one server (no /server).
mode = {{q .Mode}}

# Where players join by IP. Empty: Friends tab only.
bind = {{q .Bind}}

# HTTPS for joining by address: a Let's Encrypt certificate for this domain, or your own files.
domain = ""
tls-cert = ""
tls-key = ""

# The secret Beacon signs logins to your servers with. Keep it private.
forwarding-secret-file = "forwarding.secret"

# The world name on the Friends tab and server list.
motd = {{q .MOTD}}

# The max players shown next to the player count, on the Friends tab and the server list.
# Display only: it doesn't stop anyone joining.
show-max-players = {{.ShowMaxPlayers}}

# What the server list takes from the first server's own entry: "off", "motd", "players" or "all".
ping-passthrough = "off"

[servers]
# Your servers, as name = "host:port".
{{- range .Servers}}
{{- if .Transport}}
{{.Name}} = { address = {{q .Address}}, transport = {{q .Transport}} }
{{- else}}
{{.Name}} = {{q .Address}}
{{- end}}
{{- end}}

# Where players join, in order: if one can't be joined, the next. If their server stops while they
# play, they're moved to another one.
try = {{list .Try}}

[forced-hosts]
# Players who join by one of these addresses go to these servers, in order, instead of try.
# Friends-tab joins have no address and always use try. To use one, remove the # in front:
# "pvp.example.com" = ["pvp"]

[broadcast]
# The host name shown on the Friends tab. Empty: the motd.
host-name = {{q .HostName}}

# Gamertags or XUIDs that may use Beacon's admin commands.
admins = {{list .Admins}}

# Accept Xbox friend requests automatically.
accept-friends = {{.AcceptFriends}}

# Let admins hide the world from the Friends tab with /broadcast off.
listing-toggle = {{.ListingToggle}}
{{- range .Extra}}

# Another hosting account (30 more slots). Add one with: beacon accounts add <name>
[[broadcast.extra]]
name = {{q .Name}}
token-file = {{q .TokenFile}}
{{- if .HostName}}
host-name = {{q .HostName}}
{{- end}}
{{- if .WorldName}}
world-name = {{q .WorldName}}
{{- end}}
{{- if .Invites}}
invites = true
{{- end}}
{{- if .NoFriendAccept}}
accept-friends = false
{{- end}}
{{- if .Protocol}}
protocol = {{.Protocol}}
version = {{q .Version}}
{{- end}}
{{- end}}

[advanced]
# Local HTTP API on 127.0.0.1 (docs/control-api.md).
control-port = {{.ControlPort}}

# Let your servers share chat through the control API.
cross-server-chat = {{.CrossServerChat}}

# Least milliseconds between two joins from one IP address. 0: no limit.
login-ratelimit = 0

# Most packets a player may send in a second. 0: no limit.
packets-per-second = 0

# Most players online at once from one IP address. 0: no limit.
sessions-per-ip = 0

# The player count on the Friends tab. 0: the real count. Above 0: this number instead.
fake-player-count = {{.FakePlayerCount}}

# Or a count that wanders between min and max, moving by at most max-step each update, and never
# reaching show-max-players (a full world can't be joined). max = 0: off.
fake-player-drift = {{with .FakePlayerDrift}}{ min = {{.Min}}, max = {{.Max}}, max-step = {{.MaxStep}} }{{else}}{ min = 0, max = 0, max-step = 1 }{{end}}
{{- if .DisableClientEncryption}}
disable-client-encryption = true
{{- end}}
{{- if .NetworkDir}}
network-dir = {{q .NetworkDir}}
{{- end}}
{{- if .RejoinAddress}}
# Where players rejoin when a server's packs changed during their join.
rejoin-address = {{q .RejoinAddress}}
{{- end}}
