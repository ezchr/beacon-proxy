# Beacon Proxy configuration. Do not change config-version.
config-version = "1.0"

# "relay" (players can use /server) or "relayless" (straight to your one server).
mode = {{q .Mode}}

# Address players join by IP. Empty: Friends tab only.
bind = {{q .Bind}}

# Your domain, for a free automatic HTTPS certificate. Or set tls-cert and tls-key instead.
domain = ""
tls-cert = ""
tls-key = ""

# Secret Beacon signs logins to your servers with. Keep it private.
forwarding-secret-file = "forwarding.secret"

# World name on the Friends tab and server list.
motd = {{q .MOTD}}

# Most Bedrock players allowed on at once; more are told the server is full. Admins always
# get in. 0 means no cap.
max-players = 0

# Max players shown on the server list and on broadcast Friends-tab worlds. Only the number
# shown: it doesn't stop anyone joining (that's max-players).
show-max-players = {{.ShowMaxPlayers}}

# What the server list copies from your first server: "off", "motd", "players" or "all".
ping-passthrough = "off"

[servers]
# Your servers, as name = "host:port".
# survival = { address = "127.0.0.1:19134", forwarding = "endstone", resource-packs = false }
{{- range .Servers}}
{{- if or .Transport .Forwarding .NoPacks}}
{{.Name}} = { address = {{q .Address}}{{if .Transport}}, transport = {{q .Transport}}{{end}}{{if .Forwarding}}, forwarding = {{q .Forwarding}}{{end}}{{if .NoPacks}}, resource-packs = false{{end}} }
{{- else}}
{{.Name}} = {{q .Address}}
{{- end}}
{{- end}}

# Where players join, in order.
try = {{list .Try}}

[forced-hosts]
# Joins by these addresses go to these servers instead of try.
# "pvp.example.com" = ["pvp"]

[broadcast]
# World title and host name on the Friends tab. Empty: the motd.
world-name = ""
host-name = {{q .HostName}}

# XUIDs of the players who may use Beacon's admin commands. Beacon writes each one's gamertag
# after it and keeps it up to date.
admins = {{list .Admins}}

# XUIDs of moderators: /kick, /unmute, /mutelist, /banlist, and /ban and /mute for up to 1 day,
# unbanning only their own bans.
moderators = []

# Accept friend requests automatically.
accept-friends = {{.AcceptFriends}}

# Let admins hide the world with /broadcast off.
listing-toggle = {{.ListingToggle}}

# Player count shown: "world", "server" or "network".
player-count = {{q (or .PlayerCount "world")}}

# Server this world's players join first. Empty: try.
server = {{q .Server}}
{{- range .Extra}}

# Another world, hosted by another account. Add one with: beacon accounts add <name>
[[broadcast.extra]]
name = {{q .Name}}
token-file = {{q .TokenFile}}
{{- if .HostName}}
host-name = {{q .HostName}}
{{- end}}
{{- if .WorldName}}
world-name = {{q .WorldName}}
{{- end}}
{{- if .Invites}}
invites = true
{{- end}}
{{- if .NoFriendAccept}}
accept-friends = false
{{- end}}
{{- if .Protocol}}
protocol = {{.Protocol}}
version = {{q .Version}}
{{- end}}
server = {{q .Server}}
player-count = {{q .PlayerCount}}
{{- end}}

[advanced]
# Local HTTP API on 127.0.0.1.
control-port = {{.ControlPort}}

# Let your servers share chat through the control API.
cross-server-chat = {{.CrossServerChat}}

# Beacon's /ban, /mute, /kick and related commands.
# moderation = true
# What /kick does: "network" disconnects, "server" sends the player to another of your servers.
# kick = "network"

# Flood limits. 0: no limit.
login-ratelimit = 0
packets-per-second = 0
# packets-per-second is an average over this many seconds (short bursts pass), and a single second
# over packet-burst times it is too many anyway (-1: no burst check).
packet-window = 7
packet-burst = 4
sessions-per-ip = 0

# Show this player count instead of the real one. 0: off.
fake-player-count = {{.FakePlayerCount}}

# Or a count that wanders between min and max. max = 0: off.
fake-player-drift = {{with .FakePlayerDrift}}{ min = {{.Min}}, max = {{.Max}}, max-step = {{.MaxStep}} }{{else}}{ min = 0, max = 0, max-step = 1 }{{end}}
{{- if .DisableClientEncryption}}
disable-client-encryption = true
{{- end}}
{{- if .NetworkDir}}
network-dir = {{q .NetworkDir}}
{{- end}}
{{- if .RejoinAddress}}
# Where players rejoin when a server's packs changed during their join.
rejoin-address = {{q .RejoinAddress}}
{{- end}}
